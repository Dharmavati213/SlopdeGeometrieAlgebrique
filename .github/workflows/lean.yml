name: Lean

on:
  push:
    branches: [main]
    paths:
      - "lean/**"
      - .github/workflows/lean.yml
  pull_request:
    branches: [main]
    paths:
      - "lean/**"
      - .github/workflows/lean.yml
  workflow_dispatch:

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
          lake-package-directory: lean
          build-args: SGA
