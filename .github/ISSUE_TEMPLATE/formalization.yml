name: Formalization
description: Claim or discuss a Lean formalization of an exposé (or a section of one)
title: "[lean] "
labels: [formalization, lean]
body:
  - type: input
    id: ref
    attributes:
      label: SGA reference
      placeholder: "SGA 1 VI.6.1"
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: Statement (informal)
    validations:
      required: true
  - type: textarea
    id: mathlib
    attributes:
      label: Nearby mathlib names
      placeholder: Functor.IsFibered, …
